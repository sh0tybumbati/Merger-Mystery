<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c1a">
<title>Merger Mystery</title>
<style>
:root{
  --ink:#120c1a; --velvet:#1e1429; --plum:#2d1d3d; --bone:#efe6d2; --dim:#9a8fa8;
  --blood:#c8102e; --amber:#f2b84b; --moss:#6fa88a;
  --serif: "IM Fell English","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font-family:var(--serif);overscroll-behavior:none}
body{display:flex;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#2a1a3a 0%,var(--ink) 65%);}
#app{width:100%;max-width:440px;min-height:100%;padding:env(safe-area-inset-top) 12px 16px;display:flex;flex-direction:column;gap:10px}
h1{font-size:22px;letter-spacing:.06em;margin:10px 0 0;text-align:center;font-weight:400;
  text-shadow:2px 2px 0 var(--blood)}
h1 small{display:block;font-size:12px;letter-spacing:.2em;color:var(--dim);text-shadow:none;margin-top:2px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.pill{background:var(--plum);border:2px solid #000;border-radius:14px 4px 14px 4px;padding:4px 10px;box-shadow:2px 2px 0 #000}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
button{font-family:inherit;font-size:15px;color:var(--bone);background:var(--plum);border:2px solid #000;
  border-radius:12px 3px 12px 3px;padding:9px 10px;box-shadow:3px 3px 0 #000;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.on{background:var(--blood)}
button:disabled{opacity:.4}
.dot{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--blood);font-size:11px;text-align:center;margin-left:4px;color:#fff}
.hidden{display:none!important}

/* ---------- Evidence table ---------- */
.desk{background:linear-gradient(#3b2a20,#2a1d16);border:3px solid #000;border-radius:8px 16px 6px 14px;
  padding:8px;box-shadow:4px 4px 0 #000, inset 0 0 0 3px #4f3a2c;transform:rotate(-.4deg)}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;touch-action:none}
.cell{aspect-ratio:1;background:#160f1f;border-radius:5px 9px 5px 9px;border:2px solid #0a0610;
  display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(22px,8vw,34px)}
.cell:nth-child(odd){transform:rotate(.6deg)}
.cell:nth-child(3n){transform:rotate(-.7deg)}
.cell.sel{outline:3px solid var(--amber);outline-offset:-3px}
.cell.hint{outline:3px dashed var(--moss);outline-offset:-3px}
.item{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;position:relative;
  animation:boil .5s steps(1) infinite}
.item .tier{position:absolute;right:2px;bottom:0;font-size:10px;color:var(--amber);font-family:sans-serif}
.item.pop{animation:pop .3s ease-out, boil .5s steps(1) infinite .3s}
.chain-poison{background:radial-gradient(circle,#2f4a2f55,transparent 70%)}
.chain-words{background:radial-gradient(circle,#4a2f4a66,transparent 70%)}
.chain-fibre{background:radial-gradient(circle,#2f3f6a66,transparent 70%)}
.chain-seance{background:radial-gradient(circle,#6a5a2f66,transparent 70%)}
@keyframes boil{0%{transform:rotate(0)}25%{transform:rotate(1.5deg) translateY(-1px)}50%{transform:rotate(-1deg)}75%{transform:rotate(1deg) translateY(1px)}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.item.gen{border:2px solid var(--amber);border-radius:9px;background-color:#2b1d10;box-shadow:inset 0 0 8px #f2b84b55}
.item.gen.cool{filter:grayscale(.7) brightness(.7)}
.item.gen.lvmax{box-shadow:inset 0 0 10px var(--blood),0 0 6px var(--blood)}
.lv{position:absolute;left:1px;top:0;font-size:10px;color:#000;background:var(--amber);border-radius:6px;padding:0 4px;font-family:sans-serif;font-weight:700}
.pips{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:6px;letter-spacing:0;color:var(--amber);font-family:sans-serif;line-height:1}
.cdtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:sans-serif;color:#fff;text-shadow:1px 1px 2px #000;font-weight:700}
.geninfo{background:var(--velvet);border:2px solid #000;border-radius:10px 3px 10px 3px;padding:8px 10px;font-size:13px;line-height:1.4;box-shadow:3px 3px 0 #000;min-height:64px}
.geninfo b{color:var(--amber)}
.geninfo .next{color:var(--dim);font-size:12px;margin-top:3px}
.ghost{position:fixed;pointer-events:none;z-index:50;font-size:38px;transform:translate(-50%,-60%) rotate(-6deg);
  filter:drop-shadow(3px 5px 0 #000a)}
.tray{display:flex;gap:6px;justify-content:space-between}
.src{flex:1;padding:6px 2px;font-size:12px;line-height:1.15;text-align:center}
.src b{display:block;font-size:26px;font-weight:400}
.bin{flex:.8;border:2px dashed var(--dim);border-radius:8px;text-align:center;font-size:12px;padding:6px 2px;color:var(--dim)}
.bin b{display:block;font-size:26px;font-weight:400}
.bin.over,.bin.sel{border-color:var(--blood);color:var(--blood)}
.note{font-size:13px;color:var(--dim);text-align:center;margin:2px 0}
.legend{font-size:12px;color:var(--dim);line-height:1.5}
.legend div{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* ---------- Red string board ---------- */
.cork{position:relative;background:repeating-linear-gradient(45deg,#5a4030 0 6px,#4e3627 6px 12px);
  border:3px solid #000;border-radius:6px 14px 6px 14px;padding:10px;box-shadow:4px 4px 0 #000;min-height:420px}
#strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.row{display:flex;gap:8px;justify-content:space-between}
.suspects{margin-bottom:64px}
.card{position:relative;flex:1;background:var(--bone);color:#1a1020;border:2px solid #000;border-radius:3px;padding:8px 6px 6px;
  font-size:12px;line-height:1.25;box-shadow:3px 3px 0 #000a;transform:rotate(var(--r,0deg))}
.card::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--blood);border:2px solid #000;z-index:6}
.card h4{margin:0 0 3px;font-size:14px;font-weight:700}
.card .face{font-size:34px;text-align:center;display:block}
.card.sus{cursor:pointer;background:#d9cfe6}
.card.sus.armed{outline:3px dashed var(--blood)}
.card.sus.shake{animation:shake .4s}
.card.sus.solved{background:#f3c6cf}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}
.clue{cursor:pointer}
.clue.armed{outline:3px solid var(--amber)}
.clue.linked{background:#dfeedd}
.clue small{display:block;color:#5a4a68;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:#d9c9a8;font-size:14px;padding:30px 10px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}60%{transform:translateX(6px) rotate(2deg)}}

/* ---------- Overlay / toast ---------- */
#overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:380px;width:100%;background:var(--velvet);border:3px solid #000;border-radius:14px 4px 14px 4px;padding:18px;
  box-shadow:5px 5px 0 var(--blood);text-align:center}
.modal h2{margin:0 0 8px;font-weight:400;letter-spacing:.05em}
.modal p{font-size:15px;line-height:1.4;margin:8px 0}
.modal .big{font-size:56px}
.modal .paper{background:var(--bone);color:#1a1020;padding:10px;border-radius:3px;transform:rotate(-1.5deg);text-align:left;font-size:14px}
.spot{background:radial-gradient(circle at 50% 30%,#fff3 0,transparent 55%)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--plum);border:2px solid #000;
  border-radius:12px;padding:8px 14px;z-index:120;font-size:14px;box-shadow:3px 3px 0 #000;max-width:90%;text-align:center}

/* ---------- menu / intro / coach ---------- */
.screen{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#3a2350 0%,#160d20 55%,#0a0610 100%)}
.moon{position:absolute;top:6%;right:14%;width:78px;height:78px;border-radius:50%;background:#efe6d2;box-shadow:0 0 40px #efe6d288,inset -12px -6px 0 #cfc3a8;
  animation:boil .8s steps(1) infinite}
.bat{position:absolute;font-size:26px;animation:flap 1.2s steps(2) infinite}
.b1{top:10%;left:12%}.b2{top:22%;left:62%;animation-delay:.3s;font-size:20px}.b3{top:16%;left:36%;animation-delay:.6s;font-size:16px}
@keyframes flap{0%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(14px,-8px) rotate(6deg)}100%{transform:translate(0,0) rotate(-6deg)}}
.manor{position:absolute;bottom:0;left:0;width:100%;height:auto;max-height:38%;opacity:.95}
.logo{font-size:clamp(44px,15vw,64px);line-height:.95;margin:6px 0 0;text-align:center;font-weight:400;letter-spacing:.04em;transform:rotate(-2.5deg);
  text-shadow:3px 3px 0 var(--blood),6px 6px 0 #000;z-index:2}
.logo span{display:block;transform:translateX(12px) rotate(1.5deg)}
.tag{color:var(--dim);font-size:14px;text-align:center;margin:4px 0 14px;z-index:2;max-width:280px}
.menubtns{display:flex;flex-direction:column;gap:10px;width:min(260px,80%);z-index:2;margin-bottom:20%}
.menubtns button{font-size:17px;padding:11px 12px}
.menubtns button:nth-child(odd){transform:rotate(-.8deg)}
.menubtns button:nth-child(even){transform:rotate(.8deg)}
.menubtns button.primary{background:var(--blood)}
.ver{position:absolute;bottom:8px;font-size:11px;color:#6d6079;z-index:2}
.scene .portrait{font-size:84px;line-height:1;animation:boil .5s steps(1) infinite}
.scene .who{letter-spacing:.15em;font-size:12px;color:var(--amber);margin:2px 0 6px;text-transform:uppercase}
.scene p{min-height:88px;font-size:17px}
.dots{margin:6px 0 10px;font-size:10px;letter-spacing:3px;color:var(--dim)}
.rules{text-align:left;font-size:14px;line-height:1.45;padding-left:20px;margin:8px 0}
.rules li{margin-bottom:6px}
.casecard{background:var(--plum);border:2px solid #000;border-radius:10px 3px 10px 3px;padding:10px;margin:8px 0;text-align:left;box-shadow:3px 3px 0 #000;cursor:pointer}
.casecard.locked{opacity:.45;cursor:default}
.casecard b{display:block;font-size:16px}.casecard small{color:var(--dim)}
#coach{background:var(--amber);color:#1a1020;border:2px solid #000;border-radius:10px 3px 10px 3px;padding:8px 10px;font-size:14px;line-height:1.35;box-shadow:3px 3px 0 #000;margin-bottom:8px}
#coach a{display:inline-block;margin-left:6px;font-size:12px;text-decoration:underline;cursor:pointer;opacity:.7}
.item.gen.glow{animation:glow 1s ease-in-out infinite,boil .5s steps(1) infinite}
@keyframes glow{50%{box-shadow:0 0 14px 3px var(--amber),inset 0 0 8px #f2b84b88}}
#scenes{margin-bottom:8px;gap:6px}
#scenes button{font-size:12.5px;padding:7px 4px;line-height:1.15}
#scenes button.locked{opacity:.5;background:#1a1224}
.bubble{background:var(--bone);color:#1a1020;border:2px solid #000;border-radius:14px 14px 14px 2px;padding:10px 12px;font-size:16px;text-align:left;margin:8px 0;
  box-shadow:3px 3px 0 #000;position:relative}
.evi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.evi button{font-size:13px;padding:8px 6px;line-height:1.2}
.evi button b{display:block;font-size:26px;font-weight:400}
.shake{animation:shake .4s}
/* film grain + vignette (global stop-motion / old-print feel) */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:299;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000a 100%)}
body::after{content:"";position:fixed;inset:-40px;pointer-events:none;z-index:300;opacity:.10;mix-blend-mode:overlay;animation:grain .45s steps(1) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-14px,9px)}66%{transform:translate(11px,-13px)}}
h1::after{content:"";display:block;height:7px;margin:9px auto 0;width:72%;border:2px solid #000;transform:rotate(-.8deg);
  background:repeating-linear-gradient(90deg,var(--bone) 0 11px,var(--ink) 11px 22px)}
.portrait svg{height:132px;width:auto;display:block;margin:0 auto;filter:drop-shadow(3px 4px 0 #000a)}
.card .face svg{height:74px;width:auto;display:block;margin:0 auto 2px}
.fx{position:fixed;pointer-events:none;z-index:250;font-size:18px;animation:fx .75s ease-out forwards}
@keyframes fx{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
body.reduce .fx,body.reduce::after{display:none}
body.reduce *{animation:none!important;transition:none!important}
.menuline{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="menu" class="screen">
  <div class="moon"></div><span class="bat b1">🦇</span><span class="bat b2">🦇</span><span class="bat b3">🦇</span>
  <svg class="manor" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 200V150l40-8 8-50 14 8 6-60 12 56 16-6 4 58 30-4 6-40 14 6 10-70 14 72 34-10 6 46 20-8 8-38 12 4 14-46 10 48 26-6 8 34 34-8 12 60H0z" fill="#07030b"/>
    <g fill="#f2b84b"><rect x="58" y="112" width="8" height="12" transform="skewX(-6)"/><rect x="150" y="130" width="8" height="12"/><rect x="205" y="98" width="8" height="14" transform="skewX(6)"/><rect x="290" y="128" width="8" height="12"/></g>
    <path d="M0 200q60-30 120-8t130-6 150 10v4H0z" fill="#0a0610"/>
  </svg>
  <h1 class="logo">Merger<span>Mystery</span></h1>
  <p class="tag">Merge the evidence. Pin the strings. Catch the killer.</p>
  <div class="menubtns">
    <button id="mContinue" class="primary">▶ Continue</button>
    <button id="mNew">🕯️ New Case</button>
    <button id="mCases">📁 Case Files</button>
    <button id="mHow">❓ How to Play</button>
    <button id="mSettings">⚙️ Settings</button>
  </div>
  <div class="ver">PROTOTYPE · CASE 1 OF ∞</div>
</div>

<div id="app" class="hidden">
  <h1>The Late Mr. Grimsby<small>A MERGER MYSTERY &middot; CASE 1</small></h1>

  <div class="hud">
    <button id="menuBtn" style="padding:4px 10px" aria-label="Menu">☰</button>
    <div class="pill" id="energy"></div>
    <div class="pill" id="composure"></div>
  </div>

  <div class="tabs">
    <button id="tabTable" class="on">🔍 Evidence Table</button>
    <button id="tabBoard">📌 Red-String Board<span id="badge" class="dot hidden">0</span></button>
  </div>

  <!-- Evidence table -->
  <section id="viewTable">
    <div class="tabs" id="scenes"></div>
    <div id="coach" class="hidden"></div>
    <div class="desk"><div id="grid"></div></div>
    <p class="note" id="tip">Tap-tap also works to merge; long-press selects a generator.</p>
    <div class="geninfo" id="genInfo"></div>
    <div class="tray" id="tray"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- Board -->
  <section id="viewBoard" class="hidden">
    <div class="cork" id="cork">
      <svg id="strings"></svg>
      <div class="row suspects" id="suspects"></div>
      <div class="clues" id="clues"></div>
    </div>
    <p class="note" id="boardTip">Tap a clue, then tap the suspect it points to.</p>
    <button id="confront" class="hidden" style="width:100%;background:var(--blood)">⚖️ Confront Lady Vesper</button>
  </section>

  <button id="reset" style="font-size:12px;opacity:.6">↺ Restart case</button>
  <p class="note"><a style="color:var(--dim)" href="docs/GDD.html">Design doc</a> · <a style="color:var(--dim)" href="docs/case-1-the-late-mr-grimsby.html">Case 1 script</a></p>
</div>

<div id="overlay" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script>
/* =========================================================
   DATA  — everything content-related lives here (data-driven!)
   ========================================================= */
const COLS = 6, ROWS = 7, CELLS = COLS * ROWS;
const START_COMPOSURE = 3;

const CHAINS = {
  poison: { name:"Forensic Lab", src:"🧰", css:"chain-poison",
    gen:[["🧰","Field Kit"],["🧫","Petri Bench"],["⚗️","Chem Bench"],["🏥","Forensic Lab"]],
    tiers:[["🌫️","Dust Mote"],["🧂","Powder Pinch"],["🧪","Vial of Residue"],["🔬","Lab Slide"]], clue:"belladonna" },
  words:  { name:"Witness Desk", src:"🗄️", css:"chain-words",
    gen:[["📁","Case Folder"],["🗄️","Filing Cabinet"],["🗃️","Card Index"],["🏛️","Town Archive"]],
    tiers:[["👂","Whisper"],["💬","Rumour"],["📜","Signed Statement"]], clue:"alibi",
    // contradiction tier: two variants; only a *clashing* pair merges (into the clue)
    pair:{ tier:3, variants:[["🛌","Lady Vesper's Statement: “In bed by nine.”"],["🚪","Maid's Statement: “Conservatory door, ten to nine.”"]] } },
  fibre:  { name:"Trace Kit", src:"🧵", css:"chain-fibre",
    gen:[["🧺","Sewing Basket"],["🪡","Tailor's Kit"],["🧥","Tailor's Dummy"],["🏬","Tailor Shop"]],
    tiers:[["🧵","Loose Thread"],["🪢","Fibre Tuft"],["🧣","Silk Scrap"]], clue:"glove" },
  seance: { name:"Séance Parlour", src:"🕯️", css:"chain-seance",
    gen:[["🕯️","Candle Stand"],["🕸️","Dusty Table"],["🔮","Crystal Ball"],["🏚️","Haunted Parlour"]],
    tiers:[["🕯️","Candle Stub"],["🫗","Wax Pool"],["🔮","Spirit Board"]], clue:"ghost" }
};

const SUSPECTS = {
  vesper:{ name:"Lady Vesper", face:"puppet:vesper", bio:"The widow. Prizes rare blooms in her private conservatory." },
  morrow:{ name:"Dr. Morrow", face:"puppet:morrow", bio:"The physician. Was seen at his club all evening." },
  crane: { name:"Mr. Crane", face:"puppet:crane", bio:"The butler. Allergic to every flower; never enters a greenhouse." }
};
const CULPRIT = "vesper";

const CLUES = {
  belladonna:{ title:"Toxin: Belladonna", emoji:"☠️", who:"vesper",
    text:"The slide shows belladonna, a rare bloom. Only a garden that grows it could have supplied it." },
  alibi:{ title:"Alibi Broken", emoji:"⏰", who:"vesper", kind:"contradiction",
    text:"Two statements clash: Lady Vesper claimed she was in bed at nine, yet the maid heard the conservatory door at ten to." },
  glove:{ title:"Lavender Glove", emoji:"🧤", who:"vesper",
    text:"A scrap of lavender silk on the study latch, torn from a left-hand glove. Lavender is Lady Vesper's colour." },
  ghost:{ title:"Spirit Board: “C-R-A-N-E”", emoji:"👻", who:null,
    text:"The planchette spelled CRANE. (Ghosts, sadly, are not admissible evidence.)" }
};
/* Generators: merge two of the same chain+level to level up.
   charges = spawns before cooldown; cd = seconds to refill; w = spawn weights for item tiers 1,2,3…
   (higher levels unlock higher-tier items; final tier is never spawned directly — it must be merged) */
const GEN_LEVELS = [
  { charges:6,  cd:30, w:[100] },
  { charges:8,  cd:30, w:[65,35] },
  { charges:10, cd:28, w:[30,50,20] },
  { charges:14, cd:26, w:[10,35,55] }
];
const GEN_MAX = GEN_LEVELS.length;
function spawnTable(c,l){                       // -> [[tier,weight],…] capped below the chain's final tier
  const cap = maxTier(c)-1;
  return GEN_LEVELS[l-1].w.map((w,i)=>[i+1,w]).filter(([t])=>t<=cap);
}
const mkGen = (c,l=1)=>({ g:1, c, l, ch:GEN_LEVELS[l-1].charges, cd:0 });
const genInfo = (c,l)=>CHAINS[c].gen[l-1];
/* Locations: each has its own board and chains; later ones unlock as clues are found */
const SCENES = {
  study: { name:"The Study", icon:"📚", chains:["poison","fibre"], need:[], seed:{poison:2,fibre:2} },
  hall:  { name:"Servants' Hall", icon:"🧹", chains:["words"], need:["belladonna","glove"], seed:{words:3} },
  seance:{ name:"Séance Parlour", icon:"🕯️", chains:["seance"], need:["belladonna"], seed:{seance:2} }
};
const SCENE_IDS = Object.keys(SCENES);
function needText(id){ return SCENES[id].need.map(c=>CLUES[c].title).join(" + "); }
const NEED = ["belladonna","alibi","glove"];   // true clues required to close the case

/* =========================================================
   STATE
   ========================================================= */
const SAVE_KEY = "merger-mystery-proto-v4";
let S;
function seedBoard(id){
  const g = Array(CELLS).fill(null);
  Object.entries(SCENES[id].seed).forEach(([c,n])=>{ for(let k=0;k<n;k++){ let i; do{ i=Math.floor(Math.random()*CELLS);}while(g[i]); g[i]=mkGen(c); } });
  return g;
}
function fresh(){
  const boards = { study: seedBoard("study") };
  return { boards, scene:"study", unlocked:["study"], grid:boards.study, clues:[], links:{}, composure:START_COMPOSURE, solved:false, started:false, tut:0 };
}
function load(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&s.boards&&s.boards[s.scene]){ s.grid=s.boards[s.scene]; return s; } }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S,(k,v)=>k==="grid"?undefined:v)); }catch(e){} }
S = load();

/* ---------- generator cooldowns ---------- */
function tickGens(){
  const now=Date.now(); let changed=false;
  Object.values(S.boards).flat().forEach(it=>{ if(it&&it.g&&it.cd&&now>=it.cd){ it.ch=GEN_LEVELS[it.l-1].charges; it.cd=0; changed=true; } });
  return changed;
}

const $ = id => document.getElementById(id);
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"),2200); }
const item = (c,t,v) => { const ch=CHAINS[c]; return (ch.pair && t===ch.pair.tier && v!==undefined) ? ch.pair.variants[v] : ch.tiers[t-1]; };
const itemOf = it => item(it.c,it.t,it.v);
const mkItem = (c,t) => { const it={c,t}, pr=CHAINS[c].pair; if(pr && t===pr.tier) it.v=scarceVariant(c); return it; };
function scarceVariant(c){          // keep both sides of a contradiction available: pick the variant we have fewer of
  const pr=CHAINS[c].pair, n=pr.variants.map(()=>0);
  S.grid.forEach(x=>{ if(x&&!x.g&&x.c===c&&x.t===pr.tier&&x.v!==undefined) n[x.v]++; });
  return n[0]===n[1] ? Math.floor(Math.random()*2) : (n[0]<n[1]?0:1);
}
const maxTier = c => CHAINS[c].tiers.length;

const faceHTML = f => f.startsWith("puppet:") ? puppet(f.slice(7)) : f;

/* ---------- particle burst ---------- */
function burstAt(x,y,glyphs){
  if(CFG.reduce) return;
  for(let n=0;n<7;n++){
    const e=document.createElement("span"); e.className="fx"; e.textContent=glyphs[n%glyphs.length];
    e.style.left=x+"px"; e.style.top=y+"px";
    const a=Math.random()*Math.PI*2, r=30+Math.random()*50;
    e.style.setProperty("--dx",Math.cos(a)*r+"px"); e.style.setProperty("--dy",(Math.sin(a)*r-20)+"px"); e.style.setProperty("--r",(Math.random()*120-60)+"deg");
    document.body.appendChild(e); setTimeout(()=>e.remove(),800);
  }
}
function fx(i,glyphs){
  setTimeout(()=>{ const c=document.querySelector('.cell[data-i="'+i+'"]'); if(!c) return;
    const r=c.getBoundingClientRect(); burstAt(r.left+r.width/2,r.top+r.height/2,glyphs); },0);
}

   EVIDENCE TABLE

let selected = null, lastPop = -1, focus = null;

function renderTable(){
  tickGens();
  renderHud();
  if(focus!==null && !(S.grid[focus]&&S.grid[focus].g)) focus=null;
  const g = $("grid"); g.innerHTML = "";
  S.grid.forEach((it,i)=>{
    const d = document.createElement("div");
    d.className = "cell" + (selected===i?" sel":"");
    d.dataset.i = i;
    if(it){
      const e = document.createElement("div");
      if(it.g){
        const [emo,name] = genInfo(it.c,it.l), cool = it.ch<=0;
        e.className = "item gen "+CHAINS[it.c].css+(S.tut===0&&!cool?" glow":"")+(cool?" cool":"")+(it.l===GEN_MAX?" lvmax":"")+(lastPop===i?" pop":"");
        e.title = name;
        e.innerHTML = emo+'<span class="lv">Lv'+it.l+'</span>'+
          (cool ? '<span class="cdtxt" data-cd="'+it.cd+'"></span>'
                : '<span class="pips">'+"●".repeat(it.ch)+"○".repeat(GEN_LEVELS[it.l-1].charges-it.ch)+'</span>');
      } else {
        const [emo,name] = itemOf(it);
        e.className = "item "+CHAINS[it.c].css + (lastPop===i?" pop":"");
        e.title = name;
        e.innerHTML = emo + '<span class="tier">'+it.t+'</span>';
      }
      d.appendChild(e);
    }
    g.appendChild(d);
  });
  lastPop = -1;
  tickCooldownText();
  // tray (just the bin now; sources live on the board)
  const tr = $("tray"); tr.innerHTML = "";
  const bin = document.createElement("div"); bin.className="bin"+(selected==="bin"?" sel":""); bin.id="bin"; bin.style.flex=1; bin.innerHTML="<b>🪦</b>File away (drag or select, then tap)";
  tr.appendChild(bin);
  renderGenInfo(); renderCoach();
  // legend
  renderScenes();
  $("legend").innerHTML = SCENES[S.scene].chains.map(k=>{
    const c=CHAINS[k];
    const row=c.tiers.map((t,i)=> c.pair && i+1===c.pair.tier ? c.pair.variants[0][0]+"⚡"+c.pair.variants[1][0] : t[0]).join(" → ");
    return "<div>"+row+" → 🔎 <span>"+c.name+"</span></div>";
  }).join("");
}

function tickCooldownText(){
  const now=Date.now();
  document.querySelectorAll(".cdtxt").forEach(el=>{ el.textContent = "⏳"+Math.max(0,Math.ceil((+el.dataset.cd-now)/1000))+"s"; });
}

function tierList(c,l){
  const t=spawnTable(c,l), tot=t.reduce((a,x)=>a+x[1],0);
  return t.map(([ti,w])=>item(c,ti)[0]+" "+Math.round(100*w/tot)+"%").join(" · ");
}
function renderGenInfo(){
  const el=$("genInfo"), it = focus!==null ? S.grid[focus] : null;
  if(!it){ el.innerHTML='<span style="color:var(--dim)">Tap a generator to see its stats. Merge two of the same level to upgrade it: more charges, higher-tier items.</span>'; return; }
  const L=GEN_LEVELS[it.l-1], [emo,name]=genInfo(it.c,it.l);
  let h='<b>'+emo+' '+name+'</b> · Lv '+it.l+'/'+GEN_MAX+'<br>'+
    '⚡ '+(it.ch>0?it.ch+'/'+L.charges+' charges':'recharging…')+' · ⏳ '+L.cd+'s refill after last charge<br>'+
    'Spawns: '+tierList(it.c,it.l);
  if(it.l<GEN_MAX){
    const N=GEN_LEVELS[it.l], [ne,nn]=genInfo(it.c,it.l+1);
    const newTier = spawnTable(it.c,it.l+1).length>spawnTable(it.c,it.l).length ? ' · unlocks '+item(it.c,spawnTable(it.c,it.l+1).length)[0]+' '+item(it.c,spawnTable(it.c,it.l+1).length)[1] : '';
    h+='<div class="next">Merge 2× Lv'+it.l+' → '+ne+' '+nn+': '+N.charges+' charges, '+N.cd+'s refill'+newTier+'</div>';
  } else h+='<div class="next">Max level.</div>';
  el.innerHTML=h;
}

function pickTier(c,l){
  const t=spawnTable(c,l), tot=t.reduce((a,x)=>a+x[1],0); let r=Math.random()*tot;
  for(const [ti,w] of t){ if((r-=w)<0) return ti; }
  return t[0][0];
}
function emptyCells(){ return S.grid.map((v,i)=>v?-1:i).filter(i=>i>=0); }

function spawnFrom(i){
  tickGens();
  const gen=S.grid[i];
  if(!gen||!gen.g) return;
  focus=i;
  if(gen.ch<=0){ renderTable(); toast("Still recharging."); return; }
  const empty = emptyCells();
  if(!empty.length){ toast("Table's full — merge or file something away."); return renderTable(); }
  const j = empty[Math.floor(Math.random()*empty.length)];
  tut(0); Sfx.play("spawn");
  gen.ch--; if(gen.ch<=0) gen.cd = Date.now()+GEN_LEVELS[gen.l-1].cd*1000;
  S.grid[j] = mkItem(gen.c,pickTier(gen.c,gen.l));
  lastPop = j; commit();
}

function renderScenes(){
  const bar=$("scenes"); bar.innerHTML="";
  SCENE_IDS.forEach(id=>{
    const sc=SCENES[id], open=S.unlocked.includes(id), b=document.createElement("button");
    b.className=(id===S.scene?"on":"")+(open?"":" locked"); b.dataset.scene=id;
    b.innerHTML=sc.icon+"<br>"+(open?sc.name:"🔒 "+sc.name);
    bar.appendChild(b);
  });
}
$("scenes").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const id=b.dataset.scene;
  if(!S.unlocked.includes(id)) return toast("Locked. Find: "+needText(id));
  switchScene(id);
});
function switchScene(id){ S.scene=id; S.grid=S.boards[id]; selected=null; focus=null; drag=null; commit(); }
function checkUnlocks(){
  const opened=[];
  SCENE_IDS.forEach(id=>{
    if(!S.unlocked.includes(id) && SCENES[id].need.every(c=>S.clues.includes(c))){
      S.unlocked.push(id); S.boards[id]=seedBoard(id); opened.push(id);
    }
  });
  return opened;
}

// Inspector rewards each clue with a fresh Lv1 lead (generator) for a chain whose clue is still missing
function grantLead(){
  const open = SCENES[S.scene].chains.filter(c=>!S.clues.includes(CHAINS[c].clue));
  const empty = emptyCells();
  if(!open.length || !empty.length) return null;
  const c = open[Math.floor(Math.random()*open.length)], i = empty[Math.floor(Math.random()*empty.length)];
  S.grid[i]=mkGen(c); lastPop=i;
  return genInfo(c,1);
}

function act(from,to){        // from: cell index, to: cell index | "bin"
  if(from===to) return renderTable();
  const a = S.grid[from];
  if(!a) return;
  if(to==="bin"){
    if(a.g){ toast("Generators can't be filed away."); return renderTable(); }
    S.grid[from]=null; toast("Filed away."); return commit();
  }
  const b = S.grid[to];
  if(!b){ S.grid[to]=a; S.grid[from]=null; if(a.g) focus=to; return commit(); }
  if(a.g && b.g && a.c===b.c && a.l===b.l){            // upgrade a generator
    if(a.l>=GEN_MAX){ toast("Already at max level."); return renderTable(); }
    S.grid[from]=null; S.grid[to]=mkGen(a.c,a.l+1); lastPop=to; focus=to; tut(2); Sfx.play("upgrade"); fx(to,["⭐","🦇"]);
    const [emo,name]=genInfo(a.c,a.l+1), before=spawnTable(a.c,a.l).length, after=spawnTable(a.c,a.l+1).length;
    toast("⬆ "+emo+" "+name+" (Lv"+(a.l+1)+")! "+GEN_LEVELS[a.l].charges+" charges"+(after>before?" · now spawns "+item(a.c,after)[1]:""));
    return commit();
  }
  if(!a.g && !b.g && a.c===b.c && a.t===b.t){          // merge evidence
    const pr=CHAINS[a.c].pair;
    if(pr && a.t===pr.tier){                            // contradiction merge
      if(a.v===b.v){ toast("These two statements agree. You need testimony that clashes."); return renderTable(); }
      S.grid[from]=null; S.grid[to]=null; tut(1); commit(); reveal(CHAINS[a.c].clue); return;
    }
    S.grid[from]=null; tut(1);
    if(a.t < maxTier(a.c)){ b.t++; if(pr && b.t===pr.tier) b.v=scarceVariant(b.c); lastPop=to; Sfx.play("merge",b.t); fx(to,["✨","🕸️"]); commit(); }
    else { S.grid[to]=null; commit(); reveal(CHAINS[a.c].clue); }
    return;
  }
  S.grid[from]=b; S.grid[to]=a; if(a.g) focus=to; else if(b.g) focus=from; commit();   // swap
}

/* ---- pointer handling: drag OR tap-tap ---- */
let drag=null, ghost=null;
$("grid").addEventListener("pointerdown", e=>{
  const c = e.target.closest(".cell"); if(!c) return;
  const i = +c.dataset.i, it = S.grid[i];
  drag = { i, x:e.clientX, y:e.clientY, moved:false, had: !!it, long:false };
  if(it && it.g){                                   // long-press selects a generator (for tap-tap upgrading)
    const d=drag;
    d.timer=setTimeout(()=>{ if(drag===d && !d.moved){ d.long=true; selected=i; focus=i; renderTable(); } },450);
  }
});
window.addEventListener("pointermove", e=>{
  if(!drag || !drag.had) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>(S.grid[drag.i].g?26:12)){
    drag.moved=true; clearTimeout(drag.timer);
    const it = S.grid[drag.i];
    ghost = document.createElement("div"); ghost.className="ghost"; ghost.textContent=it.g?genInfo(it.c,it.l)[0]:itemOf(it)[0];
    document.body.appendChild(ghost);
  }
  if(ghost){ ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px";
    const el=document.elementFromPoint(e.clientX,e.clientY); $("bin")?.classList.toggle("over", !!el?.closest("#bin")); }
});
window.addEventListener("pointerup", e=>{
  if(!drag) return;
  const d = drag; drag=null; clearTimeout(d.timer);
  if(ghost){ ghost.remove(); ghost=null; }
  const el = document.elementFromPoint(e.clientX,e.clientY);
  const cell = el?.closest(".cell"), bin = el?.closest("#bin");
  if(d.moved && cell && +cell.dataset.i===d.i){ d.moved=false; }   // dropped where it started: treat as a tap
  if(d.moved){
    selected=null;
    if(bin) act(d.i,"bin"); else if(cell) act(d.i,+cell.dataset.i); else renderTable();
    return;
  }
  if(d.long) return;
  // tap
  const i = d.i, it = S.grid[i];
  if(selected===null){
    if(it && it.g){ if(it.ch>0) spawnFrom(i); else { focus=i; selected=i; renderTable(); } }   // tap = spawn
    else if(it){ selected=i; renderTable(); }
    else { renderTable(); }
  }
  else if(selected===i){ selected=null; renderTable(); }
  else { const from=selected; selected=null; act(from,i); }
});
$("tray").addEventListener("click", e=>{
  if(e.target.closest("#bin")){
    if(typeof selected==="number"){ const f=selected; selected=null; act(f,"bin"); }
    else toast("Select an item first, or drag it here.");
  }
});

function overlay(html){ const o=$("overlay"); o.innerHTML='<div class="modal">'+html+'</div>'; o.classList.remove("hidden"); }
function closeOverlay(){ $("overlay").classList.add("hidden"); }

function reveal(id){
  const c = CLUES[id];
  if(S.clues.includes(id)){ toast("Already on file."); return; }
  S.clues.push(id); tut(3); Sfx.play("clue"); burstAt(innerWidth/2,innerHeight/2.6,["🦇","✨","🕸️"]);
  const lead = grantLead(), opened = checkUnlocks(); commit();
  overlay('<div class="big">'+c.emoji+'</div><h2>'+(c.kind==='contradiction'?'⚡ Contradiction!':'Clue Discovered!')+'</h2><div class="paper"><b>'+c.title+'</b><br>'+c.text+'</div>'+
    (lead?'<p style="font-size:13px;color:var(--amber)">🎁 The Inspector sends a new lead: '+lead[0]+' '+lead[1]+' (Lv1)</p>':'')+
    opened.map(id=>'<p style="color:var(--moss)">🔓 <b>New location unlocked:</b> '+SCENES[id].icon+' '+SCENES[id].name+'</p>').join('')+
    '<p><button id="goPin">📌 Pin it to the board</button> <button id="stay">Keep merging</button></p>'+
    (opened.length?'<p><button id="goScene">'+SCENES[opened[0]].icon+' Go to '+SCENES[opened[0]].name+'</button></p>':''));
  if(opened.length) $("goScene").onclick=()=>{ closeOverlay(); showTab("table"); switchScene(opened[0]); };
  $("goPin").onclick=()=>{ closeOverlay(); showTab("board"); };
  $("stay").onclick=closeOverlay;
}

let armedClue=null;
function renderBoard(){
  const sp = $("suspects"); sp.innerHTML="";
  Object.entries(SUSPECTS).forEach(([k,s],n)=>{
    const d=document.createElement("div"); d.className="card sus"+(armedClue?" armed":"")+(S.solved&&k===CULPRIT?" solved":""); d.dataset.s=k;
    d.style.setProperty("--r",[-1.5,1,-.5][n]+"deg");
    d.innerHTML='<span class="face">'+faceHTML(s.face)+'</span><h4>'+s.name+'</h4>'+s.bio;
    sp.appendChild(d);
  });
  const cl=$("clues"); cl.innerHTML="";
  if(!S.clues.length) cl.innerHTML='<div class="empty">No clues yet.<br>Merge evidence on the Evidence Table to reveal some.</div>';
  S.clues.forEach((id,n)=>{
    const c=CLUES[id], d=document.createElement("div");
    d.className="card clue"+(armedClue===id?" armed":"")+(S.links[id]?" linked":""); d.dataset.c=id;
    d.style.setProperty("--r",[1,-1.2,.6,-.8][n%4]+"deg");
    d.innerHTML='<span class="face">'+c.emoji+'</span><h4>'+c.title+'</h4>'+(c.kind==='contradiction'?'<small style="color:#a01030;font-weight:700">⚡ CONTRADICTION</small>':'')+c.text+
      (S.links[id]?'<small>🔗 strung to '+SUSPECTS[S.links[id]].name+'</small>':'');
    cl.appendChild(d);
  });
  const linked = NEED.filter(id=>S.links[id]===CULPRIT).length;
  $("confront").classList.toggle("hidden", !(linked===NEED.length && !S.solved));
  $("boardTip").textContent = S.solved ? "Case closed." : armedClue ? "Now tap the suspect it points to." : "Tap a clue, then tap the suspect it points to. ("+linked+"/"+NEED.length+" damning threads)";
  const n=S.clues.filter(id=>!S.links[id]).length; const b=$("badge"); b.textContent=n; b.classList.toggle("hidden",!n);
  requestAnimationFrame(drawStrings);
}

function drawStrings(){
  const svg=$("strings"), cork=$("cork").getBoundingClientRect();
  if(!cork.width) return;
  let out="";
  Object.entries(S.links).forEach(([cid,sid])=>{
    const a=document.querySelector('.clue[data-c="'+cid+'"]'), b=document.querySelector('.sus[data-s="'+sid+'"]');
    if(!a||!b) return;
    out+=stringPath(a,b,cork,"#c8102e",4,"");
  });
  svg.innerHTML=out;
}
function stringPath(a,b,cork,col,w,extra){
  const A=a.getBoundingClientRect(), B=b.getBoundingClientRect();
  const x1=A.left+A.width/2-cork.left, y1=A.top-cork.top;
  const x2=B.left+B.width/2-cork.left, y2=B.bottom-cork.top;
  const sag=Math.abs(y1-y2)*.12+24;                       // sagging string
  const mx=(x1+x2)/2, my=(y1+y2)/2+sag;
  return '<path d="M'+x1+' '+y1+' Q'+mx+' '+my+' '+x2+' '+y2+'" stroke="'+col+'" stroke-width="'+w+'" fill="none" stroke-linecap="round" '+extra+'/>';
}

$("clues").addEventListener("click", e=>{
  const c=e.target.closest(".clue"); if(!c||S.solved) return;
  const id=c.dataset.c;
  if(S.links[id]){ delete S.links[id]; armedClue=id; }   // tap a strung clue to re-string it
  else armedClue = armedClue===id ? null : id;
  commit();
});
$("suspects").addEventListener("click", e=>{
  const s=e.target.closest(".sus"); if(!s||!armedClue||S.solved) return;
  const sid=s.dataset.s, cid=armedClue, clue=CLUES[cid];
  armedClue=null;
  if(clue.who===sid){ S.links[cid]=sid; Sfx.play("good"); toast("The string pulls taut. ✔"); commit(); }
  else {
    // wrong: draw a limp string that snaps
    const a=document.querySelector('.clue[data-c="'+cid+'"]'), cork=$("cork").getBoundingClientRect();
    $("strings").insertAdjacentHTML("beforeend", stringPath(a,s,cork,"#777",3,'stroke-dasharray="6 6"'));
    s.classList.add("shake");
    S.composure--; Sfx.play("snap");
    let msg = clue.who ? "Twang! That doesn't connect "+SUSPECTS[sid].name+" to the crime." : "Twang! Ghosts leave no fingerprints. A red herring.";
    if(S.composure<=0){ msg+=" (Composure restored — the Inspector gives you a nudge: three clues, one culprit.)"; S.composure=START_COMPOSURE; }
    toast(msg); save();
    setTimeout(()=>{ renderBoard(); renderHud(); },450);
  }
});
const SHOWDOWN=[
  { claim:"I never touched the tea, darling. I couldn't lift a teapot!", answer:"glove",
    retort:"Your lavender glove was snagged on the study latch, Lady Vesper. Left hand. The very hand that holds your teacup." },
  { claim:"I was in bed all evening. Ask anyone!", answer:"alibi",
    retort:"We did ask. The maid heard the conservatory door at ten to nine. Your story and hers cannot both be true." },
  { claim:"Poison? I wouldn't know belladonna from a buttercup!", answer:"belladonna",
    retort:"Then why is it the one rare bloom in your conservatory? Only your garden grows it." }];
function startShowdown(){
  let step=0, msg="";
  const draw=()=>{
    const q=SHOWDOWN[step];
    overlay('<div class="scene"><div class="portrait">'+puppet("vesper")+'</div><div class="who">Lady Vesper · '+(step+1)+' of '+SHOWDOWN.length+'</div>'+
      '<div class="bubble">“'+q.claim+'”</div>'+
      '<div class="dots">🎭 '+"♥".repeat(S.composure)+"♡".repeat(START_COMPOSURE-S.composure)+'</div>'+
      '<div style="font-size:13px;color:var(--amber);min-height:34px" id="sdMsg">'+(msg||"Present the clue that proves her wrong.")+'</div>'+
      '<div class="evi">'+S.clues.map(id=>'<button data-c="'+id+'"><b>'+CLUES[id].emoji+'</b>'+CLUES[id].title+'</button>').join("")+'</div></div>');
    document.querySelectorAll(".evi button").forEach(btn=>btn.onclick=()=>present(btn.dataset.c));
  };
  const present=id=>{
    const q=SHOWDOWN[step];
    if(id===q.answer){
      msg=""; Sfx.play("good");
      overlay('<div class="scene"><div class="portrait">'+puppet("apprentice")+'</div><div class="who">You, the Apprentice</div><div class="bubble">“'+q.retort+'”</div>'+
        '<p><button id="sdNext">'+(step<SHOWDOWN.length-1?"Next claim ▸":"Finish her ▸")+'</button></p></div>');
      $("sdNext").onclick=()=>{ step++; step<SHOWDOWN.length ? draw() : finale(); };
    } else {
      S.composure--; Sfx.play("wrong");
      msg = id==="ghost" ? "Ghosts are not admissible evidence!" : "That doesn't answer her claim. Twang!";
      if(S.composure<=0){ S.composure=START_COMPOSURE; msg+=" Poe-tential whispers: “Try the ‘"+CLUES[q.answer].title+"’ clue.” (Composure restored)"; }
      save(); renderHud(); draw(); document.querySelector(".modal").classList.add("shake");
    }
  };
  draw();
}
function finale(){
  S.solved=true; commit(); Sfx.play("eureka"); burstAt(innerWidth/2,innerHeight/3,["⭐","🦇","✨"]);
  overlay('<div class="spot"><div class="portrait">'+puppet("vesper")+'</div></div><h2>“It was YOU, Lady Vesper!”</h2>'+
    '<p>The <b>belladonna</b> came from your conservatory. Your <b>alibi</b> collapsed at ten to nine. And your <b>lavender glove</b> was caught on the study latch.</p>'+
    '<p><i>Lady Vesper laughs, and the candles gutter out…</i></p>'+
    '<p style="color:var(--dim);font-size:13px">CASE 1 CLOSED — prototype complete.<br>Next episode: <b>“The Widow’s Undertaker”</b></p>'+
    '<button id="ok">Close</button> <button id="toMenu">Main menu</button>');
  $("ok").onclick=closeOverlay; $("toMenu").onclick=showMenu;
}
$("confront").onclick=startShowdown;

/* ---------- tutorial coach ---------- */
const TUT=[
  "① Tap a glowing generator to spawn evidence.",
  "② Drag two matching items together to merge them into a higher tier.",
  "③ Drag two identical generators together to upgrade them: more charges, better items.",
  "④ Reach the final tier of a chain to reveal a clue, then pin it on the Red-String Board."];

/* ---------- settings ---------- */
const CFG_KEY="merger-mystery-settings"; let CFG={reduce:false,sfx:true,music:false};
try{ Object.assign(CFG,JSON.parse(localStorage.getItem(CFG_KEY))||{}); }catch(e){}
function applyCfg(){ document.body.classList.toggle("reduce",!!CFG.reduce); Sfx.setMusic(!!CFG.music); try{ localStorage.setItem(CFG_KEY,JSON.stringify(CFG)); }catch(e){} }

/* ---------- audio: everything synthesised with WebAudio (no asset files) ---------- */
const Sfx=(()=>{
  let ctx=null, master, mus, timer=null, beat=0, next=0, unlocked=false, want=false;
  const F=m=>440*Math.pow(2,(m-69)/12);
  function init(){ if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=.6; master.connect(ctx.destination); mus=ctx.createGain(); mus.gain.value=.3; mus.connect(master); }catch(e){ ctx=null; } }
  function tone(f,t0,dur,o={}){
    const {type="sine",vol=.3,dest=master,slide=0}=o, osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(f,t0);
    if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g); g.connect(dest); osc.start(t0); osc.stop(t0+dur+.05);
  }
  const box=(m,t0,vol=.3,dest=master)=>{ tone(F(m),t0,.9,{vol,dest}); tone(F(m+12),t0,.35,{type:"triangle",vol:vol*.35,dest}); };  // music-box timbre
  const PENT=[57,60,62,64,67,69,72,74,76,79,81];
  function play(name,arg=0){
    if(!CFG.sfx||!unlocked) return; init(); if(!ctx) return;
    const t=ctx.currentTime+.01, P=i=>PENT[Math.min(i,PENT.length-1)];
    switch(name){
      case "click":   tone(900,t,.05,{type:"square",vol:.05}); break;
      case "spawn":   tone(300,t,.14,{type:"triangle",vol:.25,slide:2}); break;
      case "merge":   box(P(arg+2),t,.3); box(P(arg+4),t+.09,.25); break;
      case "upgrade": [0,2,4,6,8].forEach((n,i)=>box(P(n),t+i*.07,.28)); break;
      case "clue":    [57,60,64,69,72].forEach((m,i)=>box(m+12,t+i*.1,.3)); tone(F(33),t,1.2,{type:"sawtooth",vol:.07}); break;
      case "good":    tone(660,t,.1,{type:"triangle",vol:.25}); tone(990,t+.08,.18,{type:"triangle",vol:.25}); break;
      case "snap":    tone(220,t,.35,{type:"sawtooth",vol:.18,slide:.3}); tone(110,t,.4,{type:"square",vol:.07,slide:.5}); break;
      case "wrong":   tone(140,t,.25,{type:"square",vol:.11}); tone(120,t+.12,.3,{type:"square",vol:.11}); break;
      case "eureka":  [57,64,69,72,76,81].forEach((m,i)=>box(m,t+i*.12,.3)); break;
    }
  }
  // 3/4 music-box waltz in A minor
  const BPM=104, BEAT=60/BPM;
  const MEL=[76,0,72, 71,0,72, 74,0,71, 69,0,0,  76,0,72, 71,0,72, 74,0,68, 69,0,0];
  const BASS=[45,45,40,45, 45,45,40,45];
  function sched(){
    while(next<ctx.currentTime+.4){
      const b=beat%24, bar=Math.floor(b/3), pos=b%3;
      if(MEL[b]) box(MEL[b],next,.5,mus);
      if(pos===0) tone(F(BASS[bar]),next,.55,{type:"triangle",vol:.5,dest:mus});
      else tone(F(BASS[bar]+19),next,.16,{type:"triangle",vol:.13,dest:mus});
      next+=BEAT; beat++;
    }
  }
  function apply(){
    if(!unlocked) return; init(); if(!ctx) return;
    if(want && !timer){ ctx.resume(); next=ctx.currentTime+.1; beat=0; timer=setInterval(sched,120); }
    if(!want && timer){ clearInterval(timer); timer=null; }
  }
  return {
    unlock(){ if(unlocked) return; unlocked=true; init(); if(ctx) ctx.resume(); apply(); },
    setMusic(on){ want=on; apply(); },
    play
  };
})();
window.addEventListener("pointerdown",()=>Sfx.unlock(),{once:true});
document.addEventListener("click",e=>{ if(e.target.closest("button")) Sfx.play("click"); });

/* ---------- screens ---------- */
function showMenu(){
  closeOverlay(); $("app").classList.add("hidden"); $("menu").classList.remove("hidden");
  const c=$("mContinue"); c.classList.toggle("hidden",!S.started);
  c.textContent = S.solved ? "⭐ Case 1 — solved" : "▶ Continue Case 1";
}
function showGame(){ $("menu").classList.add("hidden"); $("app").classList.remove("hidden"); showTab("table"); }
function newCase(){
  if(S.started && !S.solved && !confirm("Abandon your current case and start over?")) return;
  S=fresh(); selected=null; armedClue=null; focus=null; save(); commit(); playIntro(0);
}
const INTRO=[
  {who:"Grimsby Hollow · 11:04 p.m.",face:"🏚️",text:"The manor leans a little further to the left tonight, as if it were listening."},
  {who:"Inspector Bloat",face:"puppet:bloat",text:"He died of… surprise? Look at that face! And the tea isn't even cold."},
  {who:"You, the Apprentice",face:"puppet:apprentice",text:"Nobody dies of surprise, Inspector. Somebody arranged it. Bring me the teapot."},
  {who:"Poe-tential",face:"🐦‍⬛",text:"Caw. Red string for truth, grey string for gossip. Three suspects, one killer."},
  {who:"Inspector Bloat",face:"puppet:bloat",text:"The widow, the physician and the butler. All upstairs, all lying in their own special ways."},
  {who:"You, the Apprentice",face:"puppet:apprentice",text:"Then we start small. Everything begins with a single speck of dust."}];
function playIntro(i){
  const l=INTRO[i];
  overlay('<div class="scene"><div class="portrait">'+faceHTML(l.face)+'</div><div class="who">'+l.who+'</div><p>“'+l.text+'”</p>'+
    '<div class="dots">'+INTRO.map((_,n)=>n===i?"●":"○").join(" ")+'</div>'+
    '<button id="iNext">'+(i<INTRO.length-1?"Next ▸":"Begin investigation ▸")+'</button> <button id="iSkip" style="font-size:12px;opacity:.7">Skip</button></div>');
  const end=()=>{ S.started=true; save(); closeOverlay(); showGame(); };
  $("iNext").onclick=()=> i<INTRO.length-1 ? playIntro(i+1) : end();
  $("iSkip").onclick=end;
}
$("mContinue").onclick=showGame;
$("mNew").onclick=newCase;
$("menuBtn").onclick=showMenu;
$("mHow").onclick=()=>{
  overlay('<h2>How to Play</h2><ol class="rules">'+
    '<li><b>Generators</b> (gold borders) spawn evidence when tapped. Each has limited charges, then a cooldown.</li>'+
    '<li><b>Merge</b> two matching items to raise their tier. Reach the top tier of a chain to <b>reveal a clue</b>.</li>'+
    '<li><b>Merge two identical generators</b> to upgrade them: more charges, better items.</li>'+
    '<li>On the <b>Red-String Board</b>, tap a clue, then the suspect it points to. Good strings pull taut; bad ones snap and cost Composure.</li>'+
    '<li>Beware <b>red herrings</b>. Not every clue is evidence.</li>'+
    '<li>Link every damning clue to the culprit, then <b>confront</b> them.</li></ol><button id="ok">Got it</button>');
  $("ok").onclick=closeOverlay;
};
$("mCases").onclick=()=>{
  const st = S.solved ? "⭐ Solved" : S.started ? "In progress" : "New";
  overlay('<h2>Case Files</h2>'+
    '<div class="casecard" id="c1"><b>1 · The Late Mr. Grimsby</b><small>'+st+' — a widow, a doctor, a butler and a cold cup of tea</small></div>'+
    '<div class="casecard locked"><b>🔒 2 · The Widow’s Undertaker</b><small>Coming soon</small></div>'+
    '<div class="casecard locked"><b>🔒 3 · ???</b><small>Coming soon</small></div><button id="ok">Close</button>');
  $("ok").onclick=closeOverlay;
  $("c1").onclick=()=>{ closeOverlay(); S.started ? showGame() : newCase(); };
};
$("mSettings").onclick=()=>{
  const draw=()=>{
    overlay('<h2>Settings</h2>'+
      '<p><button id="sSfx">Sound effects: '+(CFG.sfx?"ON":"OFF")+'</button></p>'+
      '<p><button id="sMusic">Music box: '+(CFG.music?"ON":"OFF")+'</button></p>'+
      '<p><button id="sMotion">Reduce motion: '+(CFG.reduce?"ON":"OFF")+'</button></p>'+
      '<p><button id="sErase" style="background:#3a1020">Erase saved progress</button></p><p><button id="ok">Back</button></p>');
    $("sSfx").onclick=()=>{ CFG.sfx=!CFG.sfx; applyCfg(); draw(); };
    $("sMusic").onclick=()=>{ CFG.music=!CFG.music; applyCfg(); draw(); };
    $("sMotion").onclick=()=>{ CFG.reduce=!CFG.reduce; applyCfg(); draw(); };
    $("sErase").onclick=()=>{ if(confirm("Erase all saved progress?")){ S=fresh(); selected=null; focus=null; save(); commit(); closeOverlay(); showMenu(); toast("Save erased."); } };
    $("ok").onclick=closeOverlay;
  }; draw();
};

$("tabTable").onclick=()=>showTab("table");
$("tabBoard").onclick=()=>showTab("board");
$("reset").onclick=()=>{ if(confirm("Restart the case from scratch?")){ S=fresh(); S.started=true; S.tut=0; selected=null; armedClue=null; focus=null; commit(); showTab("table"); } };
window.addEventListener("resize",drawStrings);
setInterval(()=>{                                   // cooldown ticker: full re-render only when a generator refills
  if(drag && drag.moved) return;
  if(tickGens()) renderTable(); else tickCooldownText();
},500);
applyCfg(); commit(); showMenu();
</script>
